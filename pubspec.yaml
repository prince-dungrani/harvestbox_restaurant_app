name: harvestbox_restaurant_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI & existing packages
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.10+1

  # 🔥 Firebase Core (required)
  firebase_core: ^2.27.0

  # 🔐 Firebase Authentication
  firebase_auth: ^4.17.0

  # 🔑 Google Sign-In
  google_sign_in: ^6.2.1

  # 📦 State Management
  provider: ^6.1.1

  # 📍 Location Services
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # 🖼️ Image Caching
  cached_network_image: ^3.3.1

  # 🗄️ Firebase Realtime Database
  firebase_database: ^10.5.0

  # 📸 Image Picker
  image_picker: ^1.0.7

  # 📅 Date Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
